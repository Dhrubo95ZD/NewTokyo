name: Build Android APK and Play AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      MORETTI_KEYSTORE_PASSWORD: ${{ secrets.MORETTI_KEYSTORE_PASSWORD }}
      MORETTI_KEY_ALIAS: ${{ secrets.MORETTI_KEY_ALIAS }}
      MORETTI_KEY_PASSWORD: ${{ secrets.MORETTI_KEY_PASSWORD }}
      HAS_SIGNING: ${{ secrets.MORETTI_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out project
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Run retained game checks
        run: npm test
      - name: Build and sync Android project
        run: npm run android:sync
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Restore Play upload keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MORETTI_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moretti-upload.jks"
      - name: Build signed Play bundle
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          MORETTI_KEYSTORE_PATH: ${{ runner.temp }}/moretti-upload.jks
        run: ./gradlew bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moretti-blackwood-city-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload signed Play bundle
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moretti-blackwood-city-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
