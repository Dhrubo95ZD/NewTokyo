t="400" fill="#cbbcb0" text-anchor="start">Organize, contribute and run supported operations</text><g transform="translate(90 758) scale(1.35)" fill="none" stroke="#d7ae88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V8l8-4 8 4v12h-5v-6H9v6z"/></g><text x="138" y="783" font-family="Arial" font-size="16" font-weight="800" fill="#fff4e8" text-anchor="start">WORLD CHAT</text><text x="330" y="783" font-family="Arial" font-size="14" font-weight="400" fill="#cbbcb0" text-anchor="start">Talk with authenticated players and use safety controls</text><g transform="translate(90 806) scale(1.35)" fill="none" stroke="#d7ae88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 8 12l4 3 7-9 2 2-9 11-4-3-3 4z"/></g><text x="138" y="831" font-family="Arial" font-size="16" font-weight="800" fill="#fff4e8" text-anchor="start">RANKINGS</text><text x="330" y="831" font-family="Arial" font-size="14" font-weight="400" fill="#cbbcb0" text-anchor="start">Compare permanent records and city standing</text><rect x="54" y="885" width="972" height="445" rx="3" fill="#fffdf9" stroke="#c9b6a2"/><text x="90" y="935" font-family="Arial" font-size="14" font-weight="800" fill="#8b5536" text-anchor="start">WORLD CHAT</text><rect x="90" y="970" width="900" height="110" rx="2" fill="#f3ece4" stroke="#ddd0c3"/><g transform="translate(120 998) scale(1.8)" fill="none" stroke="#976141" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v5c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V7zm0 4 2 4 4 .5-3 3 .8 4.5-3.8-2-3.8 2 .8-4.5-3-3 4-.5z"/></g><text x="180" y="1018" font-family="Arial" font-size="22" font-weight="700" fill="#261e19" text-anchor="start">Authenticated players only</text><text x="180" y="1054" font-family="Arial" font-size="16" font-weight="400" fill="#746960" text-anchor="start">Messages appear after a real player sends them.</text><rect x="90" y="1104" width="900" height="82" rx="2" fill="#fff" stroke="#cb